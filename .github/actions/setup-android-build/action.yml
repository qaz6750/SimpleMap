name: Set up Android build environment
description: Provision JDKs, the Android SDK, and Gradle for SimpleMap workflows.

inputs:
  cache-read-only:
    description: Whether the Gradle cache should be read-only.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up JDK 21 and 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: |
          17
          21

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android 17 SDK
      shell: bash
      run: sdkmanager --channel=3 "platforms;android-37" "build-tools;36.0.0"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
        validate-wrappers: true
